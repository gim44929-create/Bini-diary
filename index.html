<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>bini's menu diary</title>
    
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/96/cupcake.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/180/cupcake.png">
    <meta name="apple-mobile-web-app-title" content="비니식단">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 20px 15px; 
            background: linear-gradient(135deg, #fff0f5 0%, #e6f2ff 100%); 
            margin: 0;
            min-height: 100vh;
            color: #444;
        }

        /* 👑 [버그 킬러] 전체 화면 타이틀과 탭바를 최상단에 배치 */
        .app-header {
            max-width: 500px;
            margin: 0 auto 15px auto;
            width: 100%;
            box-sizing: border-box;
        }
        
        h1 { color: #ff69b4; font-size: 24px; margin: 0 0 5px 0; text-align: center; }
        .subtitle { color: #77aaff; font-size: 13px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        
        /* 메뉴 탭바 스타일 */
        .tab-bar {
            display: flex;
            background: #fff;
            border-radius: 30px;
            padding: 4px;
            border: 1px solid #ffb6c1;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.15);
        }
        .tab-item {
            flex: 1;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            background: none;
            color: #ffa4d4;
            cursor: pointer;
            border-radius: 25px;
            text-align: center;
        }
        .tab-item.active {
            background: linear-gradient(to right, #ff99cc, #ffb6c1);
            color: white;
        }

        /* 메인 컨테이너 (세로모드 기본 1단 정렬) */
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .diary-box { 
            background: rgba(255, 255, 255, 0.88); 
            padding: 25px 20px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.2);
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
            border: 2px solid #ffffff;
            position: relative;
            text-align: left;
        }

        .panel-content { display: none; text-align: left; }
        .panel-content.active { display: block; }

        /* 식단 작성 카드 */
        .write-card {
            background: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            border: 1px solid #ffeef2;
        }
        .grid-row { display: flex; gap: 8px; margin-bottom: 10px; }
        
        select, input[type="text"], textarea {
            padding: 12px;
            border: 2px solid #f0f8ff;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            background: #fafafa;
            width: 100%;
        }
        select:focus, input[type="text"]:focus, textarea:focus { border-color: #ffb6c1; background: white; }
        .type-select { flex: 1.2; font-weight: bold; color: #ff69b4; }
        .name-input { flex: 2; }
        textarea { height: 65px; resize: none; }
        
        .photo-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #fff0f5;
            color: #ff69b4;
            border: 1px dashed #ffb6c1;
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        #photoPreview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; display: none; border: 1px solid #ffeef2; }

        .star-select-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            font-size: 14px;
            font-weight: bold;
            color: #666;
        }
        .star-select-row select { padding: 6px; width: auto; font-size: 13px; border: 1px solid #ffb6c1; }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #ff99cc, #ffb6c1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        /* 텀블러 트래커 */
        .water-card {
            background: #edf7ff;
            border: 1px dashed #77aaff;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .water-title { font-size: 13px; font-weight: bold; color: #4488ff; margin-bottom: 5px; }
        .water-ml-display { font-size: 16px; font-weight: bold; color: #1e40af; margin-bottom: 10px; }
        .water-drops { display: flex; justify-content: center; align-items: center; gap: 25px; font-size: 32px; }
        
        .drop { cursor: pointer; display: inline-block; transition: transform 0.2s, filter 0.2s; filter: grayscale(100%); opacity: 0.3; }
        .drop.active { filter: grayscale(0%); opacity: 1; transform: scale(1.25); text-shadow: 0 0 8px rgba(68,136,255,0.4); }
        
        .water-success-box {
            display: none; background: #fff; border: 2px solid #4488ff; color: #1e40af; border-radius: 12px; padding: 8px 12px; font-size: 12px; font-weight: bold; margin-top: 15px; text-align: center; box-shadow: 0 4px 10px rgba(68,136,255,0.1);
        }

        .status-bubble { background: #fff5f8; border: 1px dashed #ffb6c1; border-radius: 16px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .status-face { font-size: 40px; margin-bottom: 5px; }
        .status-text { font-size: 12px; font-weight: bold; line-height: 1.4; }

        /* 피드 */
        .feed-item { background: white; border-radius: 18px; padding: 15px; margin-bottom: 15px; border: 1px solid #f9f9f9; box-shadow: 0 4px 10px rgba(0,0,0,0.01); position: relative; }
        .feed-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; padding-right: 25px; }
        .item-tag { font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
        .tag-아침 { background: #e6f2ff; color: #4488ff; }
        .tag-점심 { background: #fff0f5; color: #ff4488; }
        .tag-저녁 { background: #f3e6ff; color: #8844ff; }
        .tag-간식 { background: #fffde6; color: #ccaa00; }
        
        .feed-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; margin-top: 8px; margin-bottom: 5px; border: 1px solid #f5f5f5; }
        .feed-comment { font-size: 14px; color: #666; margin-top: 8px; line-height: 1.4; padding-left: 5px; }
        .feed-stars { font-size: 12px; color: #ffcc00; margin-top: 5px; font-weight: bold; }
        
        .btn-delete { position: absolute; top: 12px; right: 15px; background: none; border: none; color: #ffb6c1; font-size: 14px; cursor: pointer; font-weight: bold; padding: 5px; }

        /* 훈장 */
        .badge-container { background: white; border-radius: 20px; padding: 15px; margin-bottom: 20px; border: 1px solid #ffeef2; text-align: center; }
        .badge-title { font-size: 13px; font-weight: bold; color: #ff69b4; margin-bottom: 8px; }
        .badge-shelf { display: flex; justify-content: center; gap: 15px; font-size: 32px; min-height: 45px; align-items: center; }
        .badge-item { filter: grayscale(100%); opacity: 0.2; transition: all 0.3s; }
        .badge-item.active { filter: grayscale(0%); opacity: 1; transform: scale(1.1); }
        .badge-count { font-size: 11px; color: #888; font-weight: bold; margin-top: 5px; }

        .week-box { background: white; border-radius: 16px; padding: 15px; margin-bottom: 12px; border-left: 5px solid #ffb6c1; }
        .week-date { font-weight: bold; color: #ff69b4; margin-bottom: 8px; font-size: 14px; }
        .week-line { font-size: 13px; color: #555; margin: 6px 0; }

        /* 달력 고정 크기 & 분홍 점 */
        .month-title { font-size: 16px; font-weight: bold; color: #ff69b4; text-align: center; margin-bottom: 15px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: white; padding: 10px; border-radius: 16px; border: 1px solid #ffeef2; }
        .cal-header { font-size: 11px; font-weight: bold; color: #77aaff; text-align: center; padding-bottom: 8px; }
        .cal-header:first-child { color: #ff69b4; }
        
        .cal-day { 
            background: #fafafa; border-radius: 8px; height: 55px; padding: 4px; box-sizing: border-box; border: 1px solid #f3f3f3; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        .cal-day:hover { background: #fff0f5; }
        .cal-day-num { font-size: 11px; font-weight: bold; color: #999; }
        .cal-today { background: #fff5f8; border: 1px dashed #ff99cc; }
        .cal-today .cal-day-num { color: #ff69b4; }
        
        .cal-dot { width: 6px; height: 6px; background-color: #ff69b4; border-radius: 50%; margin-bottom: 4px; display: none; }
        .has-log .cal-dot { display: block; }

        /* 팝업 */
        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(3px); z-index: 100; justify-content: center; align-items: center; }
        .popup-content { background: white; padding: 20px; border-radius: 20px; max-width: 350px; width: 90%; border: 2px solid #ffb6c1; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: left; }
        .popup-title { font-size: 16px; font-weight: bold; color: #ff69b4; margin-bottom: 15px; border-bottom: 1px dashed #ffb6c1; padding-bottom: 5px; }
        .popup-close { text-align: right; margin-top: 15px; }
        .popup-close button { background: #ffb6c1; color: white; border: none; padding: 6px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .popup-line { font-size: 13px; margin: 8px 0; color: #444; }
        .popup-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 12px; margin-top: 5px; margin-bottom: 5px; }
        
        .loading-text { font-size: 13px; color: #77aaff; text-align: center; font-weight: bold; margin-bottom: 15px; padding: 10px; background: #f0f8ff; border-radius: 12px; }

        /* 🌟🌟 [가로 모드 자동 레이아웃 대변신] */
        @media (min-width: 850px) {
            .app-header {
                max-width: 1100px; /* 가로 모드일 때 탭바도 시원하게 넓어짐 */
            }
            .main-container {
                display: grid;
                grid-template-columns: 1fr 1.2fr; 
                gap: 25px;
                max-width: 1100px; 
                align-items: start;
            }
            #leftFixedPanel {
                display: block !important; /* 가로모드에선 무조건 고정 노출 */
            }
            #rightDynamicPanel {
                display: block !important; /* 가로모드에선 우측 상자 무조건 노출 */
            }
        }
    </style>
</head>
<body>

    <!-- 👑 [탈출 성공] 화면 최상단 고정 헤더 영역 -->
    <div class="app-header">
        <h1>bini's menu diary</h1>
        <div class="subtitle">오늘 무엇을 맛있게 먹었나요?</div>
        
        <!-- 이제 어떤 화면에서든 무조건 맨 위에 항상 살아있는 탭바 -->
        <div class="tab-bar">
            <button class="tab-item active" onclick="toggleTab('daily')">DAILY</button>
            <button class="tab-item" onclick="toggleTab('weekly')">WEEKLY</button>
            <button class="tab-item" onclick="toggleTab('monthly')">MONTHLY</button>
        </div>
    </div>

    <!-- 메인 상자 묶음 -->
    <div class="main-container">
        
        <!-- [왼쪽 상자: 입력창 및 피드] -->
        <div id="leftFixedPanel" class="diary-box">
            <div id="loadingNotice" class="loading-text">🔄 안전한 구글 창고 동기화 중...</div>
            
            <!-- 식단 작성 카드 -->
            <div class="write-card">
                <div class="grid-row">
                    <select id="mealType" class="type-select">
                        <option value="아침">아침</option>
                        <option value="점심" selected>점심</option>
                        <option value="저녁">저녁</option>
                        <option value="간식">간식</option>
                    </select>
                    <input type="text" id="foodName" class="name-input" placeholder="음식 이름을 적어주세요">
                </div>
                
                <label for="foodPhoto" class="photo-input-label">📸 맛있는 음식 사진 추가하기 (선택)</label>
                <input type="file" id="foodPhoto" accept="image/*" style="display:none;" onchange="previewImage(this)">
                <img id="photoPreview" src="">

                <textarea id="foodComment" placeholder="오늘 식사는 어땠나요? 짧은 메모..."></textarea>
                
                <div class="star-select-row">
                    <span>맛 별점:</span>
                    <select id="foodStars">
                        <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ (우주존맛)</option>
                        <option value="⭐⭐⭐⭐">⭐⭐⭐⭐ (맛있음)</option>
                        <option value="⭐⭐⭐" selected>⭐⭐⭐ (평범함)</option>
                        <option value="⭐⭐">⭐⭐ (그냥그래)</option>
                        <option value="⭐">⭐ (다신안먹음)</option>
                    </select>
                </div>
                
                <button class="btn-register" id="submitBtn" onclick="addLog()">다이어리 기록 ✦</button>
            </div>

            <!-- 🥤 텀블러 트래커 -->
            <div class="water-card">
                <div class="water-title">🥤 bini's 700ml 텀블러 챌린지 (목표 3잔!)</div>
                <div class="water-ml-display" id="waterMlDisplay">현재 수분 섭취량: 0 ml / 2100 ml</div>
                <div class="water-drops">
                    <span class="drop" id="drop1" onclick="toggleDrop(1)">💧</span>
                    <span class="drop" id="drop2" onclick="toggleDrop(2)">💧</span>
                    <span class="drop" id="drop3" onclick="toggleDrop(3)">💧</span>
                </div>
                <div class="water-success-box" id="waterSuccessBox">
                    🎈🌊 <b>수분 완벽 충전 완료! 오늘 물 최고로 잘 마셨비니! 👑</b>
                </div>
            </div>

            <div id="statusBox" class="status-bubble"></div>
            <div id="dailyFeed"></div>
        </div>

        <!-- [오른쪽 상자: 위클리 / 먼슬리 연동창] -->
        <div id="rightDynamicPanel" class="diary-box" style="background: rgba(255, 255, 255, 0.93); display: none;">
            
            <!-- WEEKLY 패널 -->
            <div id="weeklyPanel" class="panel-content">
                <div class="badge-container">
                    <div class="badge-title">👑 bini's 수분 올클리어(3잔) 명예 훈장</div>
                    <div class="badge-shelf">
                        <span class="badge-item" id="badgeBronze">🥉</span>
                        <span class="badge-item" id="badgeSilver">🥈</span>
                        <span class="badge-item" id="badgeGold">👑</span>
                    </div>
                    <div class="badge-count" id="badgeCountText">이번 달 성공 일수: 0일</div>
                </div>
                <div id="weeklyTimeline"></div>
            </div>

            <!-- MONTHLY 패널 (달력) -->
            <div id="monthlyPanel" class="panel-content">
                <div class="month-title" id="monthLabel">2026년 6월</div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
            
        </div>

    </div>

    <!-- 팝업창 명당 -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-content">
            <div class="popup-title" id="popupTitle">식단 정보</div>
            <div id="popupBody"></div>
            <div class="popup-close"><button onclick="closePopup()">닫기</button></div>
        </div>
    </div>

    <script>
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwb2GGpkRfFvXdZ1VtG7uWEiSvUmxTh4nZ4UHV_N3b9c3tcZ3LJ36cdyLIvWt7ZzG6B/exec";

        let myLogs = [];
        let waterData = {}; 
        let encodedPhotoBase64 = ""; 

        function getTodayStr() {
            return new Date().toLocaleDateString('ko-KR');
        }

        function getSavedPhotos() {
            let photos = localStorage.getItem('bini_saved_photos');
            return photos ? JSON.parse(photos) : {};
        }

        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        const maxW = 800; 
                        const scale = Math.min(maxW / img.width, 1); 
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        encodedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8); 
                        const preview = document.getElementById('photoPreview');
                        preview.src = encodedPhotoBase64;
                        preview.style.display = 'block';
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function loadFromGoogleSheet() {
            fetch(GOOGLE_WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                myLogs = [];
                waterData = {};
                let localPhotos = getSavedPhotos(); 

                if (Array.isArray(data)) {
                    data.forEach((row, index) => {
                        if (row.name) {
                            let uniqueKey = row.date + "_" + row.name + "_" + row.type;
                            let photoData = localPhotos[uniqueKey] || localPhotos[row.date + "_" + row.name] || "";
                            
                            myLogs.unshift({
                                id: uniqueKey, 
                                date: row.date,
                                type: row.type,
                                name: row.name,
                                comment: row.comment || '',
                                photo: photoData, 
                                stars: row.stars || '⭐⭐⭐⭐⭐'
                            });
                        }
                        if (row.water) {
                            waterData[row.date] = parseInt(row.water);
                        }
                    });
                }
                document.getElementById('loadingNotice').style.display = 'none';
                renderDaily();
                updateBadges();
                renderMonthly();
                
                // 가로 모드일 때는 기본적으로 달력이 우측에 무조건 켜지게 동기화 분기 제어
                if(window.innerWidth >= 850) {
                    document.getElementById('monthlyPanel').classList.add('active');
                }
            })
            .catch(err => {
                console.error("연동 데이터 로드 실패:", err);
                document.getElementById('loadingNotice').innerText = "✨ 다이어리 활성화 완료 ✨";
                renderDaily();
            });
        }

        loadFromGoogleSheet();

        function updateBadges() {
            let successDaysCount = 0;
            for (let date in waterData) {
                if (waterData[date] === 3) successDaysCount++;
            }

            const textObj = document.getElementById('badgeCountText');
            if(textObj) textObj.innerText = `이번 달 수분 올클리어 일수: ${successDaysCount}일`;

            const b = document.getElementById('badgeBronze');
            const s = document.getElementById('badgeSilver');
            const g = document.getElementById('badgeGold');

            if(b) b.classList.remove('active');
            if(s) s.classList.remove('active');
            if(g) g.classList.remove('active');

            if (successDaysCount >= 1 && b) b.classList.add('active');
            if (successDaysCount >= 3 && s) s.classList.add('active');
            if (successDaysCount >= 5 && g) g.classList.add('active');
        }

        // 👑 [완벽한 화면 탭 제어 교통 정리]
        function toggleTab(target) {
            document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel-content').forEach(c => c.classList.remove('active'));
            
            const isWide = window.innerWidth >= 850;

            if(target === 'daily') {
                document.querySelectorAll('.tab-item')[0].classList.add('active');
                if (isWide) {
                    // 가로폭이 넓을 땐 왼쪽 고정, 오른쪽엔 달력을 매칭
                    document.getElementById('monthlyPanel').classList.add('active');
                    renderMonthly();
                } else {
                    document.getElementById('leftFixedPanel').style.display = 'block';
                    document.getElementById('rightDynamicPanel').style.display = 'none';
                    renderDaily();
                }
            } else if(target === 'weekly') {
                document.querySelectorAll('.tab-item')[1].classList.add('active');
                document.getElementById('weeklyTimeline').innerHTML = '';
                document.getElementById('weeklyPanel').classList.add('active');
                if (isWide) {
                    document.getElementById('leftFixedPanel').style.display = 'block';
                    document.getElementById('rightDynamicPanel').style.display = 'block';
                } else {
                    document.getElementById('leftFixedPanel').style.display = 'none';
                    document.getElementById('rightDynamicPanel').style.display = 'block';
                }
                updateBadges();
                renderWeekly();
            } else {
                document.querySelectorAll('.tab-item')[2].classList.add('active');
                document.getElementById('monthlyPanel').classList.add('active');
                if (isWide) {
                    document.getElementById('leftFixedPanel').style.display = 'block';
                    document.getElementById('rightDynamicPanel').style.display = 'block';
                } else {
                    document.getElementById('leftFixedPanel').style.display = 'none';
                    document.getElementById('rightDynamicPanel').style.display = 'block';
                }
                renderMonthly();
            }
        }

        window.addEventListener('resize', function() {
            const activeTabBtn = document.querySelector('.tab-item.active');
            let activeTabText = activeTabBtn ? activeTabBtn.innerText : 'DAILY';

            if (window.innerWidth >= 850) {
                document.getElementById('leftFixedPanel').style.display = 'block';
                document.getElementById('rightDynamicPanel').style.display = 'block';
                if(activeTabText === 'DAILY') {
                    document.getElementById('monthlyPanel').classList.add('active');
                }
            } else {
                if (activeTabText === 'DAILY') {
                    document.getElementById('leftFixedPanel').style.display = 'block';
                    document.getElementById('rightDynamicPanel').style.display = 'none';
                } else {
                    document.getElementById('leftFixedPanel').style.display = 'none';
                    document.getElementById('rightDynamicPanel').style.display = 'block';
                }
            }
        });

        function toggleDrop(num) {
            let currentCount = waterData[getTodayStr()] || 0;
            if (currentCount >= num) {
                currentCount = num - 1;
            } else {
                currentCount = num;
            }
            
            waterData[getTodayStr()] = currentCount;
            drawDrops();
            updateBadges();

            const bodyData = {
                action: 'water',
                date: getTodayStr(),
                type: '',
                name: '',
                comment: '',
                stars: '',
                water: currentCount
            };

            fetch(GOOGLE_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(bodyData)
            });
        }

        function drawDrops() {
            let currentCount = waterData[getTodayStr()] || 0;
            const successBox = document.getElementById('waterSuccessBox');
            for(let i=1; i<=3; i++) {
                const drop = document.getElementById('drop' + i);
                if(drop) {
                    if(i <= currentCount) drop.classList.add('active');
                    else drop.classList.remove('active');
                }
            }
            document.getElementById('waterMlDisplay').innerText = `현재 수분 섭취량: ${currentCount * 700} ml / 2100 ml`;
            if(currentCount === 3) successBox.style.display = 'block';
            else successBox.style.display = 'none';
        }

        function addLog() {
            const mealType = document.getElementById('mealType').value;
            const foodName = document.getElementById('foodName').value.trim();
            const foodComment = document.getElementById('foodComment').value.trim();
            const foodStars = document.getElementById('foodStars').value;

            if(!foodName) {
                alert("음식 이름을 적어주세요! 🎀");
                return;
            }

            let uniqueKey = getTodayStr() + "_" + foodName + "_" + mealType;

            if (encodedPhotoBase64) {
                let localPhotos = getSavedPhotos();
                localPhotos[uniqueKey] = encodedPhotoBase64;
                localStorage.setItem('bini_saved_photos', JSON.stringify(localPhotos));
            }

            myLogs.unshift({
                id: uniqueKey,
                date: getTodayStr(),
                type: mealType,
                name: foodName,
                comment: foodComment,
                photo: encodedPhotoBase64,
                stars: foodStars
            });
            renderDaily();
            renderMonthly();

            document.getElementById('foodName').value = '';
            document.getElementById('foodComment').value = '';
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('photoPreview').src = '';

            const bodyData = {
                action: 'add',
                date: getTodayStr(),
                type: mealType,
                name: foodName,
                comment: foodComment, 
                stars: foodStars,
                water: waterData[getTodayStr()] || 0
            };

            encodedPhotoBase64 = ""; 

            fetch(GOOGLE_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(bodyData)
            });
        }

        function deleteLog(uniqueKey, name, date, type) {
            if(!confirm(`'[${type}] ${name}' 기록만 골라서 삭제할까요? ✖️`)) return;

            myLogs = myLogs.filter(item => item.id !== uniqueKey);
            renderDaily();
            renderMonthly();

            let localPhotos = getSavedPhotos();
            if(localPhotos[uniqueKey]) {
                delete localPhotos[uniqueKey];
                localStorage.setItem('bini_saved_photos', JSON.stringify(localPhotos));
            }

            const bodyData = {
                action: 'delete',
                date: date,
                name: name,
                type: type
            };

            fetch(GOOGLE_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(bodyData)
            });
        }

        function renderDaily() {
            const feedContainer = document.getElementById('dailyFeed');
            const statusBox = document.getElementById('statusBox');
            if(!feedContainer || !statusBox) return;
            
            feedContainer.innerHTML = '';
            drawDrops(); 
            
            const todaysData = myLogs.filter(item => item.date === getTodayStr());

            if(todaysData.length === 0) {
                statusBox.innerHTML = `
                    <div class="status-face">🥣☁️</div>
                    <div class="status-text" style="color:#999;">오늘 아직 먹은 걸 적지 않았어요! 배고파요!</div>
                `;
            } else {
                statusBox.innerHTML = `
                    <div class="status-face">🥞✨</div>
                    <div class="status-text" style="color:#ff69b4;">야무지게 오늘 식단 기록 완료! 든든해요!</div>
                `;
            }

            todaysData.forEach(item => {
                let commentHtml = item.comment ? `<div class="feed-comment">${item.comment}</div>` : '';
                let imgHtml = item.photo ? `<img src="${item.photo}" class="feed-img">` : '';

                feedContainer.innerHTML += `
                    <div class="feed-item">
                        <button class="btn-delete" onclick="deleteLog('${item.id}', '${item.name}', '${item.date}', '${item.type}')">❌</button>
                        <div class="feed-header">
                            <span><span class="item-tag tag-${item.type}">${item.type}</span> ${item.name}</span>
                        </div>
                        ${imgHtml}
                        ${commentHtml}
                        <div class="feed-stars">${item.stars || '⭐⭐⭐⭐⭐'}</div>
                    </div>
                `;
            });
        }

        function renderWeekly() {
            const timeline = document.getElementById('weeklyTimeline');
            if(!timeline) return;
            timeline.innerHTML = '';

            if(myLogs.length === 0) {
                timeline.innerHTML = '<div style="text-align:center; color:#aaa; padding:30px; font-size:13px;">기록된 식단이 없습니다 ☁️</div>';
                return;
            }

            const grouped = {};
            myLogs.forEach(item => {
                if(!grouped[item.date]) grouped[item.date] = [];
                grouped[item.date].push(item);
            });

            for(let date in grouped) {
                let lines = '';
                const sortedList = [...grouped[date]].reverse();
                sortedList.forEach(item => {
                    let bestMark = item.stars === '⭐⭐⭐⭐⭐' ? '🔥 <b>존맛!</b>' : '';
                    let hasPhotoMark = item.photo ? '📸 ' : '';
                    lines += `<div class="week-line">🍒 <b>[${item.type}]</b> ${hasPhotoMark}${item.name} ${bestMark}</div>`;
                });

                let dayWater = waterData[date] || 0;
                let waterIcons = '💧'.repeat(dayWater) || '안마쉰 날 💦';
                let clearCrown = dayWater === 3 ? '👑' : '';

                timeline.innerHTML += `
                    <div class="week-box">
                        <div class="week-date">🗓️ ${date} ${clearCrown} <span style="font-size:11px; color:#77aaff; margin-left:10px;">(수분: ${dayWater * 700}ml ${waterIcons})</span></div>
                        ${lines}
                    </div>
                `;
            }
        }

        function renderMonthly() {
            const grid = document.getElementById('calendarGrid');
            if(!grid) return;
            grid.innerHTML = `
                <div class="cal-header">일</div><div class="cal-header">월</div><div class="cal-header">화</div>
                <div class="cal-header">수</div><div class="cal-header">목</div><div class="cal-header">금</div><div class="cal-header">토</div>
            `;

            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth();

            document.getElementById('monthLabel').innerText = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div class="cal-day" style="background:none; border:none; cursor:default;"></div>`;
            }

            for (let day = 1; day <= lastDay; day++) {
                const targetDateStr = new Date(year, month, day).toLocaleDateString('ko-KR');
                const isToday = targetDateStr === getTodayStr() ? 'cal-today' : '';
                const hasLogs = myLogs.some(item => item.date === targetDateStr) ? 'has-log' : '';

                grid.innerHTML += `
                    <div class="cal-day ${isToday} ${hasLogs}" onclick="showDayDetails('${targetDateStr}')">
                        <div class="cal-day-num">${day}</div>
                        <div class="cal-dot"></div>
                    </div>
                `;
            }
        }

        function showDayDetails(dateStr) {
            const dayDiets = myLogs.filter(item => item.date === dateStr).reverse();
            document.getElementById('popupTitle').innerText = `🌸 ${dateStr} 상세 정보`;
            
            const popupBody = document.getElementById('popupBody');
            popupBody.innerHTML = '';

            let dayWater = waterData[dateStr] || 0;

            popupBody.innerHTML += `<div style="font-size:13px; color:#4488ff; margin-bottom:10px; font-weight:bold;">💦 수분 섭취 : ${dayWater * 700} ml (${'💧'.repeat(dayWater) || '0잔'})</div>`;

            if(dayDiets.length === 0) {
                popupBody.innerHTML += '<div style="color:#aaa; text-align:center; padding:15px;">이날은 남긴 식단 기록이 없어요 ☁️</div>';
            } else {
                dayDiets.forEach(item => {
                    let imgHtml = item.photo ? `<img src="${item.photo}" class="popup-img">` : '';
                    popupBody.innerHTML += `
                        <div class="popup-line" style="border-bottom:1px solid #f9f9f9; padding-bottom:5px; margin-bottom:10px;">
                            <b>[${item.type}]</b> ${item.name} <span style="color:#ffcc00; font-size:11px;">${item.stars || ''}</span>
                            ${imgHtml}
                            <span style="color:#888; font-size:12px; display:block; padding-left:10px;">${item.comment ? 'ㄴ ' + item.comment : ''}</span>
                        </div>
                    `;
                });
            }

            document.getElementById('popupOverlay').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('popupOverlay').style.display = 'none';
        }
    </script>

</body>
</html>
